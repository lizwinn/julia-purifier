# SPDX-License-Identifier: MIT
#
# Runs every check of the flake on x86_64-linux and aarch64-linux: the
# fixture builds in the Nix sandbox, JSON3.jl's test suite as the
# real-world integration test, the lock-run unit tests, the lockfile
# reader checks and the formatting check. On x86_64-linux it also runs
# tests/cli.sh, which needs the network: relocking the fixtures, the
# offline `julia` command, the everyday loop, damaged lockfiles and
# registering a version.
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - run: nix flake check -L

  cli:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - run: bash tests/cli.sh
