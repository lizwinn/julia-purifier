# SPDX-License-Identifier: MIT
#
# Runs every check of the flake on x86_64-linux and aarch64-linux: the
# fixture builds in the Nix sandbox, JSON3.jl's test suite as the
# real-world integration test, the conformance checks of the purifier
# contract that run in the sandbox, the lock-run unit tests and the
# formatting check. On both systems it also runs the steps of tests/cli.sh,
# which need the network: the conformance checks conformance-relock,
# conformance-update and conformance-rebuild as jobs of those names, and
# the command tests (the offline `julia` command, the everyday loop,
# damaged lockfiles, prefetch and the language server, an external
# lockfile, and publishing a version) as the job cli.
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - run: nix flake check -L

  conformance:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
        check: [relock, update, rebuild]
    name: conformance-${{ matrix.check }} (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - run: bash tests/cli.sh ${{ matrix.check }}

  cli:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - run: bash tests/cli.sh julia stale loop damaged prefetch external publish
